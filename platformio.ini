[platformio]
default_envs = gate_opener

[env]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_flags = -DFIRMWARE_VERSION=\"1.0\"
lib_deps =
    sui77/rc-switch@2.6.4
    lsatan/SmartRC-CC1101-Driver-Lib@3.0.2

[env:gate_opener]
build_src_filter = +<gate_opener/>

[env:sniffer]
build_src_filter = +<../tools/sniffer/>

[env:rf_tx_test]
build_src_filter = +<../tools/rf_link_test/tx/>

[env:rf_rx_test]
build_src_filter = +<../tools/rf_link_test/rx/>
