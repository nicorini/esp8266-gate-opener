[platformio]
default_envs = gate_opener

[env]
monitor_speed = 115200
build_flags = -DFIRMWARE_VERSION=\"2.0\"
lib_deps =
    sui77/rc-switch@2.6.4
    lsatan/SmartRC-CC1101-Driver-Lib@3.0.2

[esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

[env:gate_opener]
extends = esp8266
build_src_filter = +<gate_opener/>
; HomeKit library: errors only, at INFO level it prints the pairing code on the serial port.
build_flags =
    ${env.build_flags}
    -DHOMEKIT_LOG_LEVEL=HOMEKIT_LOG_ERROR
lib_deps =
    ${env.lib_deps}
    https://github.com/Mixiaoxiao/Arduino-HomeKit-ESP8266.git#8a8e1a065005e9252d728b24f96f6d0b29993f67

[env:sniffer]
extends = esp8266
build_src_filter = +<../tools/sniffer/>

[env:rf_tx_test]
extends = esp8266
build_src_filter = +<../tools/rf_link_test/tx/>

[env:rf_rx_test]
extends = esp8266
build_src_filter = +<../tools/rf_link_test/rx/>

; Host-side unit tests of the transmit logic: pio test -e native
[env:native]
platform = native
lib_deps =
lib_ignore = gate_remote
build_flags = -Ilib/gate_remote
